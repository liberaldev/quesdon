apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: env
spec:
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 953a7c79-6486-44d6-a6be-04dd7eda1853
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: secret
        namespace: infisical

      secretsScope:
        projectId: 1dccea80-64e0-4a62-af38-c85792f3456c
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: env
      secretNamespace: quesdon
      creationPolicy: Owner
      secretType: Opaque
